services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: fitmap
      POSTGRES_PASSWORD: fitmap_dev
      POSTGRES_DB: fitmap
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fitmap -d fitmap']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: fitmap
      POSTGRES_PASSWORD: fitmap_dev
      POSTGRES_DB: fitmap
      JWT_SECRET: fitmap_jwt_dev_secret
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  pgdata:
